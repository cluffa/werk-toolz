name: Python wheelhouse

# Builds an offline pip/uv wheelhouse (one .zip per platform) from py/requirements.in
# and publishes it to the fixed "py-wheelhouse" release, so the download URLs served
# by /py never change.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      # only these two — no schedule, and no rebuild on unrelated pushes
      - py/requirements.in
      - .github/workflows/py-wheelhouse.yml

permissions:
  contents: write

concurrency:
  group: py-wheelhouse
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.13'
  RELEASE_TAG: py-wheelhouse

jobs:
  build:
    name: ${{ matrix.slug }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            slug: windows-x86_64
          - runner: ubuntu-latest
            slug: linux-x86_64
          - runner: macos-latest
            slug: macos-arm64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - name: Resolve pins
        run: |
          mkdir -p stage/wheels
          uv pip compile py/requirements.in \
            --python-version "$PYTHON_VERSION" \
            --no-header \
            -o stage/requirements.txt
          cat stage/requirements.txt

      - name: Download wheels
        # uv has no `pip download` yet, so pip fetches the files; uv did the resolving
        # above and is what the instructions use to install them.
        run: |
          python -m pip install --upgrade pip >/dev/null
          python -m pip download \
            --requirement stage/requirements.txt \
            --dest stage/wheels \
            --only-binary=:all:
          ls -1 stage/wheels

      - name: Write install instructions
        env:
          SLUG: ${{ matrix.slug }}
        run: |
          python - <<'PY'
          import os, pathlib, datetime

          slug = os.environ["SLUG"]
          py = os.environ["PYTHON_VERSION"]
          stage = pathlib.Path("stage")
          windows = slug.startswith("windows")
          built = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d %H:%M UTC")

          pins = [
              line for line in (stage / "requirements.txt").read_text().splitlines()
              if line and not line.startswith((" ", "#"))
          ]
          wheels = sorted(p.name for p in (stage / "wheels").glob("*"))

          activate = r".venv\Scripts\activate" if windows else "source .venv/bin/activate"

          # tkinter is stdlib, so no wheel can supply it - whether it is there depends
          # on how the machine's Python was built
          if windows:
              tk_note = "  The python.org and Microsoft Store builds include it, so it is almost always there."
          elif slug.startswith("macos"):
              tk_note = "  The python.org builds include it; a Homebrew python needs: brew install python-tk"
          else:
              tk_note = "  Debian/Ubuntu need: apt install python3-tk    Fedora: dnf install python3-tkinter"

          lines = [
              f"Werk Toolz Python wheelhouse - {slug}, Python {py}",
              f"Built {built} from {os.environ.get('GITHUB_REPOSITORY', '')} @ {os.environ.get('GITHUB_SHA', '')[:7]}",
              "",
              "Everything here installs with no network access. Unzip it anywhere and run one",
              "of the commands below from inside the unzipped folder.",
              "",
              "CONTENTS",
              "  wheels/            all wheels, including transitive dependencies",
              "  requirements.txt   the exact pinned set to install",
              "  install.ps1        one-shot installer (Windows PowerShell)",
              "  install.sh         one-shot installer (macOS / Linux)",
              "",
              "INSTALL WITH UV (preferred)",
              f"  uv venv --python {py}",
              "  uv pip install --no-index --find-links wheels -r requirements.txt",
              "",
              "  Into an environment you already have, without a venv:",
              "  uv pip install --system --no-index --find-links wheels -r requirements.txt",
              "",
              "INSTALL WITH PIP",
              f"  python -m venv .venv",
              f"  {activate}",
              "  python -m pip install --no-index --find-links wheels -r requirements.txt",
              "",
              "  uv is not part of this bundle. If the machine has no uv and no way to get one,",
              "  the pip commands above are fully equivalent.",
              "",
              "USING THE VENV",
              f"  {activate}",
              "  python -c \"import pandas, numpy, openpyxl; print(pandas.__version__)\"",
              "",
              "READING EXCEL FILES",
              "  import pandas as pd",
              "  pd.read_excel('book.xlsx')                      # openpyxl",
              "  pd.read_excel('book.xlsx', engine='calamine')   # faster reader",
              "  pd.read_excel('old.xls')                        # xlrd",
              "  pd.read_excel('big.xlsb')                       # pyxlsb",
              "  df.to_excel('out.xlsx', index=False)            # openpyxl / XlsxWriter",
              "",
              "BROWSER AUTOMATION (SELENIUM)",
              "  selenium is in the bundle; a browser and a driver are not. It drives a browser",
              "  already installed on the machine. Selenium Manager downloads a matching driver",
              "  on first use, which needs network access - offline, point selenium at a driver",
              "  binary you already have:",
              "",
              "  from selenium import webdriver",
              "  from selenium.webdriver.chrome.service import Service",
              r"  driver = webdriver.Chrome(service=Service(r'C:\tools\chromedriver.exe'))",
              "  driver.get('https://example.com')",
              "  driver.quit()",
              "",
              "  On a locked-down Windows box Edge is the safer target: swap chrome/Chrome for",
              "  edge/Edge above and use msedgedriver.exe, which often ships next to Edge itself.",
              "",
              "DESKTOP GUI (PYSIMPLEGUI)",
              "  PySimpleGUI 6 is LGPL3 and needs no license key - the key-and-registration era",
              "  was version 5. Nothing in it phones home on import.",
              "",
              "  It wraps tkinter, which is part of the standard library and so cannot be shipped",
              "  as a wheel. If `python -c \"import tkinter\"` fails, the bundle cannot fix it:",
              tk_note,
              "",
              "  import PySimpleGUI as sg",
              "  layout = [[sg.Text('File'), sg.Input(key='-F-'), sg.FileBrowse()],",
              "            [sg.OK(), sg.Cancel()]]",
              "  window = sg.Window('Pick a file', layout)",
              "  event, values = window.read()",
              "  window.close()",
              "",
              "PDF",
              "  dxpdf turns .docx into .pdf with no Word, no LibreOffice and no cloud service -",
              "  it is a self-contained Rust/Skia engine, so it works fully offline. It paints",
              "  with the fonts installed on the machine, so a box missing a document's font",
              "  will substitute rather than fail.",
              "",
              "  import dxpdf",
              "  dxpdf.convert_file('report.docx', 'report.pdf')",
              "",
              "  img2pdf wraps images into a PDF losslessly - JPEGs are embedded as-is, not",
              "  re-encoded:",
              "",
              "  import img2pdf",
              "  with open('scans.pdf', 'wb') as fh:",
              "      fh.write(img2pdf.convert('page1.jpg', 'page2.png'))",
              "",
              "  pdfservices-sdk is Adobe's client for their hosted PDF Services API. Unlike",
              "  everything else in this bundle it does nothing on its own: it needs Adobe",
              "  credentials and a route to Adobe's servers. It also declares Sphinx as a",
              "  runtime dependency, which is why a documentation toolchain shows up in the",
              "  pin list below - that is Adobe's packaging, not something this bundle uses.",
              "",
              "PINNED PACKAGES",
              *(f"  {p}" for p in pins),
              "",
              f"WHEELS ({len(wheels)})",
              *(f"  {w}" for w in wheels),
              "",
          ]
          (stage / "INSTALL.txt").write_text("\r\n".join(lines), encoding="utf-8")

          (stage / "install.ps1").write_text("\r\n".join([
              "# Creates .venv next to this script and installs the bundled wheels into it.",
              "$ErrorActionPreference = 'Stop'",
              "Set-Location -Path $PSScriptRoot",
              "if (Get-Command uv -ErrorAction SilentlyContinue) {",
              f"    uv venv --python {py} .venv",
              "    uv pip install --python .venv --no-index --find-links wheels -r requirements.txt",
              "} else {",
              "    python -m venv .venv",
              "    .\\.venv\\Scripts\\python.exe -m pip install --no-index --find-links wheels -r requirements.txt",
              "}",
              "Write-Host 'Done. Activate with: .\\.venv\\Scripts\\activate'",
              "",
          ]), encoding="utf-8")

          sh = stage / "install.sh"
          sh.write_text("\n".join([
              "#!/usr/bin/env bash",
              "# Creates .venv next to this script and installs the bundled wheels into it.",
              "set -euo pipefail",
              'cd "$(dirname "$0")"',
              "if command -v uv >/dev/null 2>&1; then",
              f"    uv venv --python {py} .venv",
              "    uv pip install --python .venv --no-index --find-links wheels -r requirements.txt",
              "else",
              "    python3 -m venv .venv",
              "    ./.venv/bin/python -m pip install --no-index --find-links wheels -r requirements.txt",
              "fi",
              'echo "Done. Activate with: source .venv/bin/activate"',
              "",
          ]), encoding="utf-8")
          sh.chmod(0o755)
          PY
          cat stage/INSTALL.txt

      - name: Zip
        env:
          SLUG: ${{ matrix.slug }}
        run: |
          python - <<'PY'
          import os, pathlib, zipfile

          slug = os.environ["SLUG"]
          name = f"werk-toolz-wheelhouse-{slug}-py{os.environ['PYTHON_VERSION'].replace('.', '')}.zip"
          stage = pathlib.Path("stage")
          out = pathlib.Path("dist"); out.mkdir(exist_ok=True)

          with zipfile.ZipFile(out / name, "w", zipfile.ZIP_DEFLATED) as z:
              for root, dirs, files in os.walk(stage):
                  root = pathlib.Path(root)
                  dirs[:] = sorted(dirs)
                  for f in sorted(files):
                      path = root / f
                      z.write(path, path.relative_to(stage))
          size = (out / name).stat().st_size / 1e6
          print(f"{name}: {size:.1f} MB")
          with open(os.environ["GITHUB_ENV"], "a") as fh:
              fh.write(f"ZIP_NAME={name}\n")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: wheelhouse-${{ matrix.slug }}
          path: dist/${{ env.ZIP_NAME }}
          retention-days: 7
          # already compressed
          compression-level: 0

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release notes
        run: |
          {
            echo "Offline pip/uv wheelhouse for Python ${PYTHON_VERSION}, rebuilt ${GITHUB_SHA:0:7} on $(date -u '+%Y-%m-%d')."
            echo
            echo "Unzip, then \`uv pip install --no-index --find-links wheels -r requirements.txt\`."
            echo "Full instructions are in \`INSTALL.txt\` inside each zip."
            echo
            echo "| download | size |"
            echo "| --- | --- |"
            for f in dist/*.zip; do
              name=$(basename "$f")
              printf '| [%s](https://github.com/%s/releases/download/%s/%s) | %s |\n' \
                "$name" "$GITHUB_REPOSITORY" "$RELEASE_TAG" "$name" "$(du -h "$f" | cut -f1)"
            done
          } > notes.md
          cat notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Python wheelhouse
          body_path: notes.md
          files: dist/*.zip
          make_latest: true

      - name: Prune stale assets
        # asset names carry the Python version, so a version bump leaves the old
        # zips behind — drop anything this run did not just upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            --jq '.assets[] | "\(.id) \(.name)"' |
          while read -r id name; do
            if [ ! -f "dist/$name" ]; then
              echo "deleting stale asset $name"
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id"
            fi
          done
